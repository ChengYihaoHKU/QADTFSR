trainer:
  target: trainer.TrainerBase
train:
  error_weight_1: [1, 1, 0.01] # mse lpips dis, iteration 1
  error_weight_2: [1, 1, 0.01] # mse lpips dis, iteration 2
  seed: 123456
  global_seeding: False
  wandb_logging: False
  # ema_rate: 0.999
  local_logging: True
  lr: 5e-5
  lr_min: 2e-5
  warmup_iterations: 5000
  lr_schedule: cosin
  weight_decay: 0
  use_amp: False
  iterations: 400000
  val_resolution: 512
  val_padding_mode: reflect
  batch: [4, 8]  
  microbatch: 4
  num_workers: 8
  log_freq: [200, 2000, 100]  # [training loss, training images, val batch record]\

  save_freq: 10000
  val_freq: ${train.save_freq}

  ckpt_path: ~
  gp_coef: 0.0001

data:
  train:
    type: realesrgan
    params:
      dir_paths: []
      txt_file_path: [
                      "./train_files.txt",
                     ] 
      im_exts: ['png', ]
      io_backend:
        type: disk
      blur_kernel_size: 21
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      sinc_prob: 0.1
      blur_sigma: [0.2, 3.0]
      betag_range: [0.5, 4.0]
      betap_range: [1, 2.0]

      blur_kernel_size2: 15
      kernel_list2: ['iso', 'aniso']
      kernel_prob2: [0.5, 0.5]
      sinc_prob2: 0.1
      blur_sigma2: [0.2, 1.5]
      betag_range2: [0.5, 4.0]
      betap_range2: [1, 2.0]

      final_sinc_prob: 0.8

      gt_size: 512
      crop_pad_size: 300
      use_hflip: False
      use_rot: False
      rescale_gt: True
  val:
    type: base
    iterative: 1
    params:
      dir_path: /path/to/CelebA_test_pair/lq
      im_exts: png
      transform_type: default
      transform_kwargs:
          mean: 0.5
          std: 0.5
      extra_dir_path: /path/to/CelebA_test_pair/hq
      extra_transform_type: default
      extra_transform_kwargs:
          mean: 0.5
          std: 0.5
      recursive: False
     
  eval:
    type: dtls
    
    params:
      dir_path: ${data.val.params.dir_path}
      im_exts: png
      transform_type: default
      transform_kwargs:
          mean: 0.5
          std: 0.5
      extra_dir_path: ${data.val.params.extra_dir_path}      # this is for ground truth images
      extra_transform_type: default
      extra_transform_kwargs:
          mean: 0.5
          std: 0.5
      recursive: False
      
degradation:
  sf: [2, 4, 8, 16]
  weights: [0.25, 0.25, 0.25, 0.25]
  # the first degradation process
  resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  # the second degradation process
  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 512 
  resize_back: True
  use_sharp: False


